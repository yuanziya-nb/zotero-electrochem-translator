<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Electrochem Translation</title>
  <style>
    body { margin: 0; font: 14px sans-serif; color: #202124; }
    header { padding: 12px 16px; background: #1f2937; color: white; font-weight: 600; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
    section { min-width: 0; }
    h2 { font-size: 13px; margin: 0 0 6px; color: #555; }
    textarea { box-sizing: border-box; width: 100%; height: 300px; resize: none; border: 1px solid #bbb; border-radius: 5px; padding: 10px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>Electrochem English–Chinese Translation</header>
  <main>
    <section><h2>English</h2><textarea id="source" readonly></textarea></section>
    <section><h2>中文</h2><textarea id="target" readonly></textarea></section>
  </main>
  <script>
    window.addEventListener('message', event => {
      if (event.data && typeof event.data === 'object') {
        document.getElementById('source').value = event.data.source || '';
        document.getElementById('target').value = event.data.translated || '';
      }
    });
  </script>
</body>
</html>
